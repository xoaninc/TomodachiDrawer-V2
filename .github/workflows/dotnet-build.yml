name: .NET Build Test and Publish artifacts

on:
  push:
    branches:
      - main
    tags:
      - '*.*.*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Restore dependencies
      run: dotnet restore -v n /p:EnableWindowsTargeting=true
    - name: Build
      run: dotnet build --configuration ${{ matrix.configuration }} --no-restore
    - name: Test
      run: dotnet test --configuration ${{ matrix.configuration }} --no-build --verbosity normal /p:EnableWindowsTargeting=true
  build-rp-firmware:
    name: Compile ${{ matrix.platform }} Firmware
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: rp2040
            board: waveshare_rp2040_zero
          - platform: rp2350
            board: waveshare_rp2350_zero
    steps:
    - uses: actions/checkout@v6
    - name: Install toolchain
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib build-essential python3 git
    - name: Checkout pico-sdk
      uses: actions/checkout@v6
      with:
        repository: raspberrypi/pico-sdk
        ref: '2.2.0'
        path: pico-sdk
        submodules: recursive
    - name: Build firmware
      working-directory: TomodachiDrawer.Firmware
      env:
        PICO_SDK_PATH: ${{ github.workspace }}/pico-sdk
      run: |
        cmake -G Ninja -B build-${{ matrix.platform }} -DPICO_BOARD=${{ matrix.board }} -DPICO_PLATFORM=${{ matrix.platform }}
        cmake --build build-${{ matrix.platform }} --parallel
    - name: Upload firmware artifact
      uses: actions/upload-artifact@v7
      with:
        name: TomodachiDrawer-Firmware-${{ matrix.platform }}
        path: TomodachiDrawer.Firmware/build-${{ matrix.platform }}/TomodachiDrawer.Firmware.${{ matrix.platform }}.uf2
  publish-avalonia:
    runs-on: ubuntu-latest
    needs: [build, build-rp-firmware]
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
        runtime: [win-x64, linux-x64, linux-arm64, osx-x64, osx-arm64] # win-arm64 removed since Google.OrTools dont even ship it. How does that not give a build warning??

    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'
        cache: true
        cache-dependency-path: '**/*.csproj'
    - name: Download firmware artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: TomodachiDrawer-Firmware-*
        path: TomodachiDrawer.V2
        merge-multiple: true
    - name: Build
      working-directory: TomodachiDrawer.V2
      run: |
        dotnet publish --configuration ${{ matrix.configuration }} \
          -r ${{ matrix.runtime }} \
          --self-contained \
          ${{ !contains(matrix.runtime, 'osx') && '-p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true' || '-p:BundleMacOSApp=true' }} \
          ${{ github.ref_type == 'tag' && format('-p:Version={0}', github.ref_name) || '' }}
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: TomodachiDrawer-V2-${{ matrix.runtime }}-${{ matrix.configuration }}
        path: TomodachiDrawer.V2/bin/${{ matrix.configuration }}/net10.0/${{ matrix.runtime }}/publish/
  release:
    name: Draft release
    runs-on: ubuntu-latest
    needs: publish-avalonia
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v6
    - name: Download artifacts
      uses: actions/download-artifact@v8
      with:
        path: unzipped-artifacts
        merge-multiple: false
        pattern: '*-Release'
    - name: Zip for Release
      run: |
        mkdir final-packages
        for dir in unzipped-artifacts/*/; do
          dirname=$(basename "$dir")
          cd "$dir"
          echo "Zipping/Tarring ${dirname}"

          outname="${dirname//osx/mac}"
          outname="${outname//-Release/}"
          
          if [[ "$dirname" == *"osx"* ]]; then
            echo "Mac .tar.gz"
            chmod +x "TomodachiDrawer V2.app/Contents/MacOS/TomodachiDrawerV2"
            tar -czvf "../../final-packages/${outname}-${{ github.ref_name }}.tar.gz" "TomodachiDrawer V2.app" TomodachiDrawer.Firmware.rp2040.uf2 TomodachiDrawer.Firmware.rp2350.uf2 README.txt
          elif [[ "$dirname" == *"linux"* ]]; then
            echo "Linux .tar.gz"
            chmod +x TomodachiDrawerV2
            tar -czvf "../../final-packages/${outname}-${{ github.ref_name }}.tar.gz" *
          else
            echo "Windows .zip"
            zip -r "../../final-packages/${outname}-${{ github.ref_name }}.zip" .
          fi
          
          cd ../..
        done
    - name: Create release draft
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Create a draft release for this tag (review the artifacts, then hit Publish). If a
        # release for the tag already exists, just (re)upload the assets instead of failing.
        gh release create "${{ github.ref_name }}" final-packages/* \
          --draft --generate-notes --title "TomodachiDrawer V2 ${{ github.ref_name }}" \
        || gh release upload "${{ github.ref_name }}" final-packages/* --clobber
